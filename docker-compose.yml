services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-sim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interview_app
      POSTGRES_PASSWORD: interview_dev
      POSTGRES_DB: interview_sim
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_app -d interview_sim"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: interview-sim-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10   

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: interview-sim-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://interview_app:interview_dev@postgres:5432/interview_sim
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: